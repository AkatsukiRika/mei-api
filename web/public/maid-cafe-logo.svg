<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD6E8" />
      <stop offset="52%" stop-color="#FF9EC7" />
      <stop offset="100%" stop-color="#F46AA6" />
    </linearGradient>
    <linearGradient id="bowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF66A8" />
      <stop offset="100%" stop-color="#E0357F" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="24" y1="30" x2="40" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5CA1" />
      <stop offset="100%" stop-color="#DC2B77" />
    </linearGradient>
  </defs>

  <!-- Circular strawberry-pink emblem -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#6E2647" stroke-width="2.4" />
  <circle cx="32" cy="32" r="26.5" stroke="#FFF7FB" stroke-width="1.4" stroke-opacity="0.85" stroke-dasharray="3.2 2.6" />

  <!-- Subtle top gloss -->
  <ellipse cx="25" cy="14" rx="11" ry="4.5" transform="rotate(-18 25 14)" fill="#FFFFFF" fill-opacity="0.35" />

  <!-- Maid ruffled lace headband (scalloped white frill arch) -->
  <path
    d="M13 24C12.2 20.8 14.5 18.2 17.3 18.7C18.2 15.6 21.5 14.1 24.2 15.6C26.1 12.9 29.9 12.2 32 14.2C34.1 12.2 37.9 12.9 39.8 15.6C42.5 14.1 45.8 15.6 46.7 18.7C49.5 18.2 51.8 20.8 51 24C45.2 20.8 38.8 19.4 32 19.4C25.2 19.4 18.8 20.8 13 24Z"
    fill="#FFFDFE"
    stroke="#6E2647"
    stroke-width="2.1"
    stroke-linejoin="round"
  />
  <!-- Headband inner pink satin band -->
  <path
    d="M15.5 23.8C20.6 21.1 26.2 19.8 32 19.8C37.8 19.8 43.4 21.1 48.5 23.8"
    stroke="#F04E93"
    stroke-width="2.4"
    stroke-linecap="round"
  />

  <!-- Left satin ribbon bow -->
  <g>
    <path d="M13.5 25.5L10.8 30.8L14.3 29.8L16.2 31.8L16.8 26.2" fill="#E0357F" stroke="#6E2647" stroke-width="1.6" stroke-linejoin="round" />
    <path d="M15 24.5C11.4 21.6 8.8 23.2 9.6 26.2C10.3 28.6 13.1 27.6 15 25.4Z" fill="url(#bowGrad)" stroke="#6E2647" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M15.6 24.5C18.8 21.4 21.5 22.8 20.9 25.8C20.4 28.2 17.6 27.5 15.6 25.4Z" fill="url(#bowGrad)" stroke="#6E2647" stroke-width="1.8" stroke-linejoin="round" />
    <circle cx="15.3" cy="25" r="2" fill="#FFE6F2" stroke="#6E2647" stroke-width="1.6" />
  </g>

  <!-- Right satin ribbon bow -->
  <g>
    <path d="M50.5 25.5L53.2 30.8L49.7 29.8L47.8 31.8L47.2 26.2" fill="#E0357F" stroke="#6E2647" stroke-width="1.6" stroke-linejoin="round" />
    <path d="M49 24.5C52.6 21.6 55.2 23.2 54.4 26.2C53.7 28.6 50.9 27.6 49 25.4Z" fill="url(#bowGrad)" stroke="#6E2647" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M48.4 24.5C45.2 21.4 42.5 22.8 43.1 25.8C43.6 28.2 46.4 27.5 48.4 25.4Z" fill="url(#bowGrad)" stroke="#6E2647" stroke-width="1.8" stroke-linejoin="round" />
    <circle cx="48.7" cy="25" r="2" fill="#FFE6F2" stroke="#6E2647" stroke-width="1.6" />
  </g>

  <!-- Porcelain teacup handle -->
  <path
    d="M43.5 34.5H46.2C49.1 34.5 51 36.4 51 39C51 41.7 48.9 43.6 46 43.6H42.5"
    stroke="#FFFDFE"
    stroke-width="4.2"
    stroke-linecap="round"
  />
  <path
    d="M43.5 34.5H46.2C49.1 34.5 51 36.4 51 39C51 41.7 48.9 43.6 46 43.6H42.5"
    stroke="#6E2647"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Saucer -->
  <ellipse cx="31.5" cy="49.5" rx="15.5" ry="3.4" fill="#FFF7FB" stroke="#6E2647" stroke-width="2" />

  <!-- Porcelain teacup body -->
  <path
    d="M19.5 31.5H43.5V38.2C43.5 44.6 38.4 48.8 31.5 48.8C24.6 48.8 19.5 44.6 19.5 38.2V31.5Z"
    fill="#FFFDFE"
    stroke="#6E2647"
    stroke-width="2.2"
    stroke-linejoin="round"
  />
  <!-- Strawberry tea rim -->
  <ellipse cx="31.5" cy="31.5" rx="12" ry="2.7" fill="#FFD1E6" stroke="#6E2647" stroke-width="2" />

  <!-- Center strawberry heart emblem on teacup -->
  <path
    d="M31.5 44.6C31.5 44.6 25.2 40.5 25.2 36.7C25.2 34.7 26.8 33.3 28.6 33.3C29.9 33.3 30.9 34 31.5 35C32.1 34 33.1 33.3 34.4 33.3C36.2 33.3 37.8 34.7 37.8 36.7C37.8 40.5 31.5 44.6 31.5 44.6Z"
    fill="url(#heartGrad)"
    stroke="#6E2647"
    stroke-width="1.7"
    stroke-linejoin="round"
  />

  <!-- Cute sparkle accents -->
  <path d="M32 7.2L32.9 9.3L35 10.2L32.9 11.1L32 13.2L31.1 11.1L29 10.2L31.1 9.3L32 7.2Z" fill="#FFFDFE" />
  <circle cx="22" cy="27" r="1.3" fill="#FFFDFE" />
  <circle cx="41" cy="27" r="1.3" fill="#FFFDFE" />
</svg>
